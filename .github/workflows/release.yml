name: Release

# On a version tag (e.g. v0.1.0), build the desktop apps (Windows + Linux) and
# the Android APK in clean runners, then publish them on a GitHub Release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Restores ~/.gradle/caches + ~/.gradle/wrapper, keyed by *.gradle*,
          # gradle-wrapper.properties and libs.versions.toml. Cuts Gradle setup +
          # dependency-resolve from minutes to seconds on warm runs.
          cache: gradle
      - name: Build Windows app image
        shell: pwsh
        run: .\gradlew.bat --no-daemon :composeApp:createDistributable
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path composeApp/build/compose/binaries/main/app/OpenFTBA -DestinationPath "OpenFTBA-${{ github.ref_name }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: OpenFTBA-*-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Restores ~/.gradle/caches + ~/.gradle/wrapper, keyed by *.gradle*,
          # gradle-wrapper.properties and libs.versions.toml. Cuts Gradle setup +
          # dependency-resolve from minutes to seconds on warm runs.
          cache: gradle
      - name: Install .deb packaging deps
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils
      - name: Build Linux app image + .deb
        run: ./gradlew --no-daemon :composeApp:createDistributable :composeApp:packageDeb
      - name: Zip app image
        run: (cd composeApp/build/compose/binaries/main/app && zip -r "$GITHUB_WORKSPACE/OpenFTBA-${{ github.ref_name }}-linux-x64.zip" OpenFTBA)
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            OpenFTBA-*-linux-x64.zip
            composeApp/build/compose/binaries/main/deb/*.deb

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Restores ~/.gradle/caches + ~/.gradle/wrapper, keyed by *.gradle*,
          # gradle-wrapper.properties and libs.versions.toml. Cuts Gradle setup +
          # dependency-resolve from minutes to seconds on warm runs.
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openftba-release.jks"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/openftba-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :composeApp:assembleRelease
      - name: Rename APK
        run: cp composeApp/build/outputs/apk/release/composeApp-release.apk "OpenFTBA-${{ github.ref_name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: OpenFTBA-*.apk

  release:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            OpenFTBA ${{ github.ref_name }} — privacy-first, local-only cycling analytics.

            **Downloads**
            - `OpenFTBA-*-windows-x64.zip` — portable Windows app (unzip, run `OpenFTBA.exe`).
            - `OpenFTBA-*-linux-x64.zip` — portable Linux app, plus a `.deb` installer.
            - `OpenFTBA-*.apk` — Android (signed; enable "install from unknown sources").

            **Web / self-host:** `docker pull ghcr.io/smbdsbrain/openftba:latest`
            (see the README for `docker compose`).
